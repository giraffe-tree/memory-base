  - id: anthropic-research
    title: Anthropic · 工具、托管与上下文
    description: 区分本地文件工具、托管Memory Stores、自托管同步和会话压缩的代码边界。
    lessons:
      - projects.anthropic.overview
      - projects.anthropic.tool-lifecycle
      - projects.anthropic.context-management
  - id: comparisons
    title: 横向比较 · ReMe × Mem0
    description: 沿相同问题比较状态归属、写入、更正与检索，不混用两套实现。
    lessons:
      - comparisons.architecture-map
      - comparisons.write-path
      - comparisons.fact-updates
      - comparisons.retrieval-context
  - id: three-way-comparisons
    title: 三方比较 · ReMe × Mem0 × Letta
    description: 逐项对照三个固定版本，每个结论提供各自源码证据及实测边界。
    lessons:
      - comparisons.three-way-architecture
      - comparisons.three-way-write-path
      - comparisons.three-way-fact-updates
      - comparisons.three-way-retrieval-context
  - id: experiments
    title: 实验与待验证问题
    description: 已运行的局部实验，与仍需模型或完整运行时验证的边界。
    lessons:
      - experiments.configuration-boundaries
      - experiments.duplicate-write
      - experiments.fact-updates
      - experiments.mem0-local-boundaries
      - experiments.letta-memory-constraints
